<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RuralCare - Secure Records</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #ffd6e8,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #d9e8ff,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #eef7ff,
                    #fff1f8
                );
        }


        .security-card {

            width: 100%;
            max-width: 430px;

            background: rgba(255,255,255,0.96);

            padding: 40px 30px;

            border-radius: 28px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(70,80,150,0.20);
        }


        .lock-icon {

            width: 85px;
            height: 85px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #ff6fa5
                );

            font-size: 40px;

            box-shadow:
                0 10px 25px rgba(102,126,234,0.25);
        }


        h1 {

            color: #3154b8;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .subtitle {

            color: #777f9e;

            font-size: 15px;

            margin-bottom: 28px;
        }


        .pin-input {

            width: 100%;

            padding: 16px;

            border: 2px solid #e4e7f5;

            border-radius: 15px;

            text-align: center;

            font-size: 24px;

            letter-spacing: 8px;

            outline: none;
        }


        .pin-input:focus {

            border-color: #667eea;

            box-shadow:
                0 0 0 4px rgba(102,126,234,0.10);
        }


        .unlock-btn {

            width: 100%;

            margin-top: 18px;

            padding: 15px;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #ff5f9e
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }


        .error {

            margin-top: 18px;

            padding: 12px;

            border-radius: 12px;

            background: #ffe8ee;

            color: #d6335c;

            font-weight: 600;
        }


        .footer {

            margin-top: 25px;

            color: #9299b5;

            font-size: 13px;
        }


        @media(max-width:500px) {

            .security-card {

                padding: 32px 20px;
            }

            h1 {

                font-size: 26px;
            }
        }

    </style>

</head>


<body>

    <div class="security-card">

        <div class="lock-icon">
            🔐
        </div>

        <h1>
            Secure Patient Records
        </h1>

        <p class="subtitle">
            Enter your security PIN to continue
        </p>


        <form method="POST">

            <input
                type="password"
                name="pin"
                class="pin-input"
                placeholder="••••"
                maxlength="4"
                inputmode="numeric"
                pattern="[0-9]{4}"
                required
                autofocus
            >

            <button
                type="submit"
                class="unlock-btn"
            >
                🔓 Unlock Records
            </button>

        </form>


        {% if error %}

        <div class="error">
            ⚠️ {{ error }}
        </div>

        {% endif %}


        <div class="footer">
            💙 RuralCare — Protected Patient Data
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RuralCare Patient Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ffe4f0,
                #e7f0ff,
                #f3e5ff
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .page {
            width: 100%;
            max-width: 650px;
        }

        .title {
            text-align: center;
            color: #7b2cbf;
            font-size: 38px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(100, 60, 150, 0.25);

            border: 3px solid #f3c4df;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #d63384;

            margin-top: 18px;
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #6a3d70;
            margin-bottom: 7px;
            margin-top: 18px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;

            border: 2px solid #e4c8df;
            border-radius: 12px;

            font-size: 16px;
            outline: none;
            background: #fffaff;
        }

        input:focus,
        select:focus {
            border-color: #d63384;

            box-shadow:
                0 0 0 4px rgba(214, 51, 132, 0.12);
        }

        /* SYMPTOMS */

        .symptoms-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;

            background: #fff4fa;
            padding: 15px;

            border-radius: 15px;
            border: 2px solid #f0c9df;
        }

        .symptom {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 10px;

            background: white;

            border-radius: 10px;

            border: 1px solid #ead7e5;
        }

        .symptom input {
            width: 18px;
            height: 18px;
        }

        .symptom label {
            margin: 0;
            color: #555;
            font-weight: normal;
        }

        .button {
            width: 100%;

            margin-top: 25px;

            padding: 16px;

            border: none;
            border-radius: 14px;

            background: linear-gradient(
                90deg,
                #d63384,
                #8e44ad,
                #3f72af
            );

            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .button:hover {
            transform: scale(1.02);
        }

        .medical-icons {
            text-align: center;
            font-size: 35px;
            margin-bottom: 10px;
        }

        @media(max-width:600px) {

            .title {
                font-size: 28px;
            }

            .card {
                padding: 22px;
            }

            .symptoms-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="medical-icons">
        🩺 💊 🏥 🧑‍⚕️
    </div>

    <h1 class="title">
        RuralCare
    </h1>

    <p class="subtitle">
        Patient Registration & Healthcare Token
    </p>

    <div class="card">

        <form method="POST">

            <div class="section-title">
                👤 Patient Information
            </div>

            <label>Patient Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter patient name"
                required
            >


            <label>Age</label>

            <input
                type="number"
                name="age"
                min="0"
                max="120"
                placeholder="Enter age"
                required
            >


            <label>Gender</label>

            <select name="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Female">
                    👩 Female
                </option>

                <option value="Male">
                    👨 Male
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Phone Number</label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
            >


            <label>Village / Address</label>

            <input
                type="text"
                name="village"
                placeholder="Enter village or address"
            >


            <div class="section-title">
                🩺 Select Symptoms
            </div>

            <div class="symptoms-box">

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Fever"
                           id="fever">
                    <label for="fever">🌡️ Fever</label>
                </div>

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Cough"
                           id="cough">
                    <label for="cough">😷 Cough</label>
                </div>

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Cold"
                           id="cold">
                    <label for="cold">🤧 Cold</label>
                </div>

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Headache"
                           id="headache">
                    <label for="headache">🤕 Headache</label>
                </div>

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Body Pain"
                           id="bodypain">
                    <label for="bodypain">💪 Body Pain</label>
                </div>

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Stomach Pain"
                           id="stomach">
                    <label for="stomach">🤢 Stomach Pain</label>
                </div>

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Vomiting"
                           id="vomiting">
                    <label for="vomiting">🤮 Vomiting</label>
                </div>

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Dizziness"
                           id="dizziness">
                    <label for="dizziness">😵 Dizziness</label>
                </div>

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Weakness"
                           id="weakness">
                    <label for="weakness">🥱 Weakness</label>
                </div>

                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Breathing Difficulty"
                           id="breathing">
                    <label for="breathing">🫁 Breathing Difficulty</label>
                </div>
                <div class="symptom">
                    <input type="checkbox"
                           name="symptoms"
                           value="Other"
                           id="Other">
                    <label for="Other">➕ OTHER</label>
                </div>

            </div>


            <button
                type="submit"
                class="button">

                🎟️ Generate Healthcare Token

            </button>

        </form>

    </div>

</div>

</body>
</html>
